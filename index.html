<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candy Market</title>

<style>
:root{
  --bg1:#0b0f14;
  --bg2:#88c7ff;
  --text:#eaf2ff;
  --accent:#1e6ce0;
  --border:#24425f;
}

body{
  margin:0;
  font-family:system-ui;
  color:var(--text);
  background:linear-gradient(135deg,var(--bg1),#0e1622,var(--bg2));
}

.container{max-width:1000px;margin:auto;padding:20px;}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}

.btn{
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#1e293b;
  color:white;
  width:100%;
  margin-top:5px;
  cursor:pointer;
}

.primary{background:var(--accent);}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;}

.card{
  background:rgba(21,32,48,.8);
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
  <h2 id="title">🛒 Candy Market</h2>
  <button class="btn" onclick="toggleLang()">AR / EN</button>
</div>

<button class="btn" onclick="showOrders()">View Orders</button>

<div class="grid">

<div class="card">
  <h3 id="milkText">Milk</h3>
  <p>20 EGP</p>
  <input type="number" id="q1" min="0" value="0" onchange="updateCart()">
</div>

<div class="card">
  <h3 id="breadText">Bread</h3>
  <p>5 EGP</p>
  <input type="number" id="q2" min="0" value="0" onchange="updateCart()">
</div>

<div class="card">
  <h3 id="eggsText">Eggs</h3>
  <p>30 EGP</p>
  <input type="number" id="q3" min="0" value="0" onchange="updateCart()">
</div>

</div>

<div class="card" style="margin-top:20px;">
  <h3 id="cartTitle">Cart</h3>
  <div id="cart"></div>
</div>

<div class="card" style="margin-top:20px;">
  <h3 id="orderTitle">Order Details</h3>

  <input id="name" class="btn" placeholder="Name">
  <input id="phone" class="btn" placeholder="Phone" maxlength="11"
    oninput="this.value=this.value.replace(/[^0-9]/g,'')">
  <input id="address" class="btn" placeholder="Address">

  <select id="payment" class="btn">
    <option value="">Payment Method</option>
    <option>Cash</option>
    <option>InstaPay</option>
  </select>

  <button onclick="placeOrder()" class="btn primary" id="orderBtn">
    Place Order
  </button>

</div>

<div class="card" style="margin-top:20px;">
  <h3>Orders</h3>
  <div id="ordersList"></div>
</div>

</div>

<script>

let lang="en";
const DELIVERY_FEE = 30;

const translations={
  en:{
    title:"🛒 Candy Market",
    cart:"Cart",
    order:"Order Details",
    name:"Name",
    phone:"Phone",
    address:"Address",
    payment:"Payment Method",
    cash:"Cash",
    insta:"InstaPay",
    orderBtn:"Place Order",
    milk:"Milk",
    bread:"Bread",
    eggs:"Eggs"
  },
  ar:{
    title:"🛒 سوبر ماركت",
    cart:"السلة",
    order:"بيانات الطلب",
    name:"الاسم",
    phone:"رقم الموبايل",
    address:"العنوان",
    payment:"طريقة الدفع",
    cash:"كاش",
    insta:"إنستاباي",
    orderBtn:"تأكيد الطلب",
    milk:"لبن",
    bread:"عيش",
    eggs:"بيض"
  }
};

function toggleLang(){
  lang = lang==="en" ? "ar" : "en";
  let t = translations[lang];

  document.getElementById("title").innerText=t.title;
  document.getElementById("cartTitle").innerText=t.cart;
  document.getElementById("orderTitle").innerText=t.order;
  document.getElementById("orderBtn").innerText=t.orderBtn;

  document.getElementById("milkText").innerText=t.milk;
  document.getElementById("breadText").innerText=t.bread;
  document.getElementById("eggsText").innerText=t.eggs;

  document.getElementById("name").placeholder=t.name;
  document.getElementById("phone").placeholder=t.phone;
  document.getElementById("address").placeholder=t.address;

  document.getElementById("payment").options[0].text=t.payment;
  document.getElementById("payment").options[1].text=t.cash;
  document.getElementById("payment").options[2].text=t.insta;
}

function updateCart(){
  let cart=document.getElementById("cart");
  let total=0;
  cart.innerHTML="";

  let q1 = Number(document.getElementById("q1").value);
  let q2 = Number(document.getElementById("q2").value);
  let q3 = Number(document.getElementById("q3").value);

  let hasItems = false;

  if(q1>0){
    cart.innerHTML+=`<p>${translations[lang].milk} x ${q1} = ${q1*20} EGP</p>`;
    total+=q1*20;
    hasItems=true;
  }

  if(q2>0){
    cart.innerHTML+=`<p>${translations[lang].bread} x ${q2} = ${q2*5} EGP</p>`;
    total+=q2*5;
    hasItems=true;
  }

  if(q3>0){
    cart.innerHTML+=`<p>${translations[lang].eggs} x ${q3} = ${q3*30} EGP</p>`;
    total+=q3*30;
    hasItems=true;
  }

  if(hasItems){
    cart.innerHTML+=`<p>Delivery = ${DELIVERY_FEE} EGP</p>`;
    total+=DELIVERY_FEE;
  }

  cart.innerHTML+=`<hr><strong>Total: ${total} EGP</strong>`;
}

function getProducts(){
  return {
    milk: Number(document.getElementById("q1").value),
    bread: Number(document.getElementById("q2").value),
    eggs: Number(document.getElementById("q3").value)
  };
}

function placeOrder(){

  let name=document.getElementById("name").value;
  let phone=document.getElementById("phone").value;
  let address=document.getElementById("address").value;
  let payment=document.getElementById("payment").value;
  let products=getProducts();

  if(phone.length!==11){alert("Phone must be 11 digits");return;}
  if(!name||!phone||!address||!payment){alert("Fill all data");return;}

  if(products.milk==0 && products.bread==0 && products.eggs==0){
    alert("Choose products");
    return;
  }

  let hasItems =
    products.milk>0 ||
    products.bread>0 ||
    products.eggs>0;

  let delivery = hasItems ? DELIVERY_FEE : 0;

  let order={name,phone,address,payment,products,delivery};

  let all=JSON.parse(localStorage.getItem("orders"))||[];
  all.push(order);
  localStorage.setItem("orders",JSON.stringify(all));

  alert(lang==="en"?"Order placed ✅":"تم تأكيد الطلب ✅");

  document.getElementById("name").value="";
  document.getElementById("phone").value="";
  document.getElementById("address").value="";
  document.getElementById("payment").value="";
  document.getElementById("q1").value=0;
  document.getElementById("q2").value=0;
  document.getElementById("q3").value=0;

  updateCart();
}

function showOrders(){
  let orders=JSON.parse(localStorage.getItem("orders"))||[];
  let div=document.getElementById("ordersList");
  div.innerHTML="";

  if(orders.length===0){
    div.innerHTML="<p>No orders yet</p>";
    return;
  }

  orders.forEach((o,i)=>{
    div.innerHTML+=`
      <div style="border-bottom:1px solid #555;margin-bottom:10px;">
        <p><strong>#${i+1}</strong></p>
        <p>${o.name}</p>
        <p>${o.phone}</p>
        <p>${o.address}</p>
        <p>${o.payment}</p>
        <p>
          Milk: ${o.products.milk},
          Bread: ${o.products.bread},
          Eggs: ${o.products.eggs},
          Delivery: ${o.delivery} EGP
        </p>
      </div>
    `;
  });
}

</script>

</body>
</html>
